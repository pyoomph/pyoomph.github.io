name: Deploy Page

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }} # Recommended if you intend to make multiple deployments in quick succession.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧 # This example project is built using npm and outputs the result to the 'build' folder. Replace with the commands required to build your project, or remove this step entirely if your site is pre-built.
        run: |
           python -m pip install pybtex pybtex-docutils pillow beautifulsoup4 
           bash gen_page.sh
           ls _generated/*
        
      - name: Deploy 🚀
        # On a pull request the build above is the useful part: a PR from a fork
        # only ever gets a read-only GITHUB_TOKEN, so the push to gh-pages below
        # would fail with a 403 and mark the whole run red without publishing
        # anything. Deploy only on push to main (and on workflow_dispatch).
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _generated
